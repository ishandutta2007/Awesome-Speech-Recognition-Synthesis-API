<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Sound Waves (Background Dynamic Layer) -->
  <g opacity="0.35">
    <!-- Waveform 1 -->
    <path fill="none" stroke="#38bdf8" stroke-width="4" d="M0,150 Q150,90 300,150 T600,150 T900,150 T1200,150">
      <animate attributeName="d" 
               dur="6s" 
               repeatCount="indefinite" 
               values="M0,150 Q150,70 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,210 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,70 300,150 T600,150 T900,150 T1200,150" />
    </path>
    <!-- Waveform 2 -->
    <path fill="none" stroke="#818cf8" stroke-width="3" d="M0,150 Q150,220 300,150 T600,150 T900,150 T1200,150">
      <animate attributeName="d" 
               dur="4s" 
               repeatCount="indefinite" 
               values="M0,150 Q150,230 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,70 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,230 300,150 T600,150 T900,150 T1200,150" />
    </path>
    <!-- Waveform 3 -->
    <path fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8 8" d="M0,150 Q150,110 300,150 T600,150 T900,150 T1200,150">
      <animate attributeName="d" 
               dur="5s" 
               repeatCount="indefinite" 
               values="M0,150 Q150,110 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,190 300,150 T600,150 T900,150 T1200,150;
                       M0,150 Q150,110 300,150 T600,150 T900,150 T1200,150" />
    </path>
  </g>

  <!-- Pulsing Equalizer Bars (Left & Right Accents) -->
  <g fill="#38bdf8" opacity="0.4">
    <rect x="50" y="120" width="8" height="60" rx="4">
      <animate attributeName="height" values="60;110;40;60" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="120;95;130;120" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="100" width="8" height="100" rx="4">
      <animate attributeName="height" values="100;50;130;100" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="100;125;85;100" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="90" y="130" width="8" height="40" rx="4">
      <animate attributeName="height" values="40;90;30;40" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="130;105;135;130" dur="1.2s" repeatCount="indefinite" />
    </rect>

    <rect x="1100" y="120" width="8" height="60" rx="4">
      <animate attributeName="height" values="60;40;110;60" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="120;130;95;120" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="1120" y="100" width="8" height="100" rx="4">
      <animate attributeName="height" values="100;130;50;100" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="100;85;125;100" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="1140" y="130" width="8" height="40" rx="4">
      <animate attributeName="height" values="40;30;90;40" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="130;135;105;130" dur="1.7s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="600" y="125" font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      Awesome Speech Recognition &amp; Synthesis API
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="175" font-size="20" font-weight="500" fill="url(#subGrad)" letter-spacing="0.5">
      🎙️ Curated List of SaaS Products, Real-Time Speech AI &amp; Open-Source Voice Pipelines 🔊
    </text>

    <!-- Tagline Badges -->
    <g transform="translate(420, 215)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="50" y="18" font-size="12" font-weight="600" fill="#38bdf8">Speech-to-Text</text>
    </g>
    <g transform="translate(535, 215)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="50" y="18" font-size="12" font-weight="600" fill="#818cf8">Text-to-Speech</text>
    </g>
    <g transform="translate(650, 215)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="55" y="18" font-size="12" font-weight="600" fill="#c084fc">Voice AI Agents</text>
    </g>
  </g>
</svg>
